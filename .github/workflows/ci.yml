name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          tmp_dir="${RUNNER_TEMP}/gitleaks-${version}"
          mkdir -p "$tmp_dir"
          curl --fail --silent --show-error --location "$url" --output "$tmp_dir/$archive"
          echo "$expected_sha256  $tmp_dir/$archive" | sha256sum --check --status
          tar --extract --file "$tmp_dir/$archive" --directory "$tmp_dir" gitleaks
          chmod 0755 "$tmp_dir/gitleaks"
          "$tmp_dir/gitleaks" version

      - name: Scan versioned snapshot for secrets
        shell: bash
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.30.1/gitleaks
        run: |
          set -euo pipefail
          snapshot_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-snapshot.XXXXXX")"
          cleanup() {
            rm -rf -- "$snapshot_dir"
          }
          trap cleanup EXIT

          git ls-files -z \
            | tar --no-recursion --null --verbatim-files-from --files-from=- --create \
            | tar --extract --directory="$snapshot_dir"

          "$GITLEAKS_BIN" dir --redact --exit-code 1 "$snapshot_dir"

      - name: Enable Corepack and pnpm for cache setup
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@12.11.2 --activate

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify package manager
        shell: bash
        run: test "$(corepack pnpm --version)" = "12.11.2"

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: Dependency audit
        shell: bash
        run: corepack pnpm audit --audit-level high

      - name: TypeScript
        shell: bash
        run: corepack pnpm exec tsc --noEmit

      - name: ESLint
        shell: bash
        run: corepack pnpm lint

      - name: Prettier
        shell: bash
        run: corepack pnpm run format:css:check

      - name: Unit tests
        shell: bash
        run: corepack pnpm test:unit:coverage

      - name: Component tests with coverage
        shell: bash
        run: corepack pnpm test:components:coverage

      - name: Verify LCOV reports
        shell: bash
        run: |
          test -s coverage/lcov.info
          test -s coverage/components/lcov.info

      - name: Upload LCOV coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage
          if-no-files-found: error

      - name: Production build
        shell: bash
        run: corepack pnpm build

      - name: Encoding
        shell: bash
        run: corepack pnpm check:encoding:all

      - name: Git whitespace check
        shell: bash
        run: git diff --check

  sonar:
    name: SonarQube Analysis
    needs: quality
    runs-on: ubuntu-24.04
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download LCOV coverage
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: coverage-lcov
          path: coverage

      - name: Verify LCOV reports
        shell: bash
        run: |
          test -s coverage/lcov.info
          test -s coverage/components/lcov.info

      - name: Cache SonarQube packages
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v6.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.organization=alba-vega
            -Dsonar.projectKey=alba-vega_arknights-iberia
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage/components/lcov.info
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
