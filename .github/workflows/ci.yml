name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-24.04
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          tmp_dir="${RUNNER_TEMP}/gitleaks-${version}"
          mkdir -p "$tmp_dir"
          curl --fail --silent --show-error --location "$url" --output "$tmp_dir/$archive"
          echo "$expected_sha256  $tmp_dir/$archive" | sha256sum --check --status
          tar --extract --file "$tmp_dir/$archive" --directory "$tmp_dir" gitleaks
          chmod 0755 "$tmp_dir/gitleaks"
          "$tmp_dir/gitleaks" version

      - name: Scan versioned snapshot for secrets
        shell: bash
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/gitleaks-8.30.1/gitleaks
        run: |
          set -euo pipefail
          snapshot_dir="$(mktemp -d "$RUNNER_TEMP/gitleaks-snapshot.XXXXXX")"
          cleanup() {
            rm -rf -- "$snapshot_dir"
          }
          trap cleanup EXIT

          git ls-files -z \
            | tar --null --verbatim-files-from --files-from=- --no-recursion --create \
            | tar --extract --directory="$snapshot_dir"

          "$GITLEAKS_BIN" dir --redact --exit-code 1 "$snapshot_dir"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Verify package manager
        shell: bash
        run: test "$(corepack pnpm --version)" = "12.11.2"

      - name: Install dependencies
        shell: bash
        run: corepack pnpm install --frozen-lockfile

      - name: TypeScript
        shell: bash
        run: corepack pnpm exec tsc --noEmit

      - name: ESLint
        shell: bash
        run: corepack pnpm lint

      - name: Prettier
        shell: bash
        run: corepack pnpm run format:css:check

      - name: Unit tests
        shell: bash
        run: corepack pnpm test:unit

      - name: Production build
        shell: bash
        run: corepack pnpm build

      - name: Encoding
        shell: bash
        run: corepack pnpm check:encoding:all

      - name: Git whitespace check
        shell: bash
        run: git diff --check
